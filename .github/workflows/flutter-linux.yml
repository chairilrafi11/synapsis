name: Flutter Linux CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev dpkg-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Build for Linux
        run: flutter build linux

      - name: Create .deb package
        run: |
          mkdir -p myapp_deb/usr/local/bin
          mkdir -p myapp_deb/DEBIAN
          cp build/linux/x64/release/bundle/myapp myapp_deb/usr/local/bin/
          echo "Package: myapp
Version: 1.0.0
Section: base
Priority: optional
Architecture: amd64
Depends: libgtk-3-0
Maintainer: Your Name <you@email.com>
Description: My Flutter Linux App" > myapp_deb/DEBIAN/control
          mv myapp_deb.deb myapp_1.0.0_amd64.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-linux-deb
          path: myapp_1.0.0_amd64.deb
